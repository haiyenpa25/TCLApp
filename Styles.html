<style>
  :root {
    --color-primary: #154212;
    --color-primary-container: #2d5a27;
    --color-on-primary: #ffffff;
    --color-primary-fixed: #bcf0ae;
    --color-surface: #f8faf5;
    --color-surface-container: #edeeea;
    --color-surface-container-low: #f2f4f0;
    --color-surface-container-lowest: #ffffff;
    --color-on-surface: #191c1a;
    --color-on-surface-variant: #42493e;
    --color-outline: #72796e;
    --color-outline-variant: #c2c9bb;
    --color-secondary: #805533;
    --color-status-free: #4CAF50;
    --color-status-occupied: #FF9800;
    --color-status-reserved: #2196F3;
    --color-status-urgent: #D32F2F;
    --color-status-preparing: #FFC107;
    --color-error: #ba1a1a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--color-surface);
    color: var(--color-on-surface);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .font-display {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(21, 66, 18, 0.2);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(21, 66, 18, 0.4);
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleUp {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pulseSubtle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
  .animate-scale-up { animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-spin-slow { animation: spin 1.2s linear infinite; }
  .animate-pulse-subtle { animation: pulseSubtle 2s infinite; }

  /* Shadows */
  .shadow-soft { box-shadow: 0 4px 20px -2px rgba(21, 66, 18, 0.06); }
  .shadow-card { box-shadow: 0 2px 12px rgba(21, 66, 18, 0.04); }
  .shadow-float { box-shadow: 0 10px 30px -5px rgba(21, 66, 18, 0.15); }
  .shadow-drawer { box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15); }

  /* Modal Backdrop */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-container {
    background: var(--color-surface-container-lowest);
    border-radius: 1.5rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    border: 1px solid var(--color-outline-variant);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: 100%;
  }

  /* Toast Notification */
  #toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast-item {
    pointer-events: auto;
    background: #191c1a;
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    animation: fadeIn 0.2s ease-out forwards;
  }

  /* Utility display classes */
  .hidden { display: none !important; }
</style>
